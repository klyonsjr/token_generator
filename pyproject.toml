[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-token"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.1.1",
    "cryptography>=40.0.0",
]

[project.scripts]
broker-token = "broker_token.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["broker_token*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
